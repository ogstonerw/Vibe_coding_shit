description = "Validity-profile authority changes are B4 single-use actions requiring one exact Level-B signature plus independent second factor. The canonical payload binds previous_configuration_sha256 derived and verified from exact prior operating-manifest bytes plus its registry record; new_configuration_sha256 must differ from that prior configuration, and a replacement manifest reusing it denies. A caller-supplied global registry shape covers every owner epoch and has pinned protocol-genesis identity/hash plus closed contiguous record/index constraints. Its only successful helper result is NON_AUTHORIZING_B4_REGISTRY_SHAPE_VALID: shape never proves a current/fresh checkpoint, complete runtime history, persistence, atomicity or durable consumption. Actual readiness requires an independently trusted current registry checkpoint from the PM-DEC-007 runtime trust root. Because that capability is unavailable, canonical epoch-9 genesis, stale canonical genesis replayed for epoch 10, and self-declared consumed records all return DENY_B4_CURRENT_REGISTRY_CHECKPOINT_OR_RUNTIME_TRUST_UNAVAILABLE after shape checks; malformed, reset, replay and parent-reuse inputs remain denied earlier. A replacement operating manifest must be canonical exact bytes with a canonical PurePosix versioned ref, digest, bounded times and exact change/profile/configuration bindings. Caller-supplied prior-manifest registry exact-byte shape binds the next version/sequence and exact supersedes ref/version/sequence/hash chain; it does not prove registry trust, currentness or completeness. Path aliases, non-increasing/replayed sequence or one identity mapped to different digests deny. Every pure validator remains non-authorizing and is not runtime persistence or a trust root. Automated tightening remains a separate immutable restrictive overlay and cannot mutate or rebound the owner envelope."
evidence = "prior configuration derivation from exact manifest bytes/record, mismatched previous configuration, unchanged new configuration and reused-config replacement denial; registry-shape-only success, epoch-9/epoch-10 readiness denial, self-declared consumption denial, pinned genesis mutation, registry reset, hidden prefix, cross-epoch parent reuse, duplicate parent, sequence/CAS, path alias, supersedes/identity-digest, malformed/old manifest, overlay and rebound fixtures"
implementation_status = "PARTIAL_NON_AUTHORIZING_VALIDATORS"
current_evidence_limit = "PM-DEC-007 trust root, dual-factor verifier, signed registry and durable single-use runtime do not exist."

