work_item = "TB-001"
target_stage = "dry_run"

[[criteria]]
id = "AC-001"
title = "Only BTCUSDT is accepted"
evidence = "Unit tests reject every non-allowlisted symbol before order intent creation."

[[criteria]]
id = "AC-002"
title = "Risk is capped at 3 percent per setup"
evidence = "Property tests cover price, stop distance, leverage, partial fills, and all three entry orders."

[[criteria]]
id = "AC-003"
title = "Signal text cannot override local risk"
evidence = "Fixtures containing 0.5%, 1%, 1/2, and 1/3 produce the same local cap."

[[criteria]]
id = "AC-004"
title = "Duplicate delivery is idempotent"
evidence = "Replay of the same Telegram event creates exactly one setup and one set of intents."

[[criteria]]
id = "AC-005"
title = "Unknown exchange state fails closed"
evidence = "Timeout and lost-ack tests enter RECONCILING and do not resubmit blindly."

[[criteria]]
id = "AC-006"
title = "DRY_RUN cannot call a trading endpoint"
evidence = "Network-spy integration test proves zero trading-endpoint calls and fails on attempted bypass."

[[criteria]]
id = "AC-007"
title = "Breakeven follows TP2 and actual fills"
evidence = "Tests calculate fee-aware breakeven after the second target and never loosen a safer stop."

[[criteria]]
id = "AC-008"
title = "Restart recovery creates no duplicate"
evidence = "Crash/restart replay restores state and reconciles existing intents without duplication."

[[criteria]]
id = "AC-009"
title = "Telegram control plane is private"
evidence = "Unauthorized user IDs receive no trade data and cannot execute commands."

[[criteria]]
id = "AC-010"
title = "Replay has no future leakage"
evidence = "Timestamp-bound fixtures prove edits, replies, market data, and fills are only visible after event time."

[[criteria]]
id = "AC-011"
title = "Maximum position count is enforced"
evidence = "The sixth concurrent setup is rejected before any order intent is submitted."

[[criteria]]
id = "AC-012"
title = "No secrets appear in repository or logs"
evidence = "Secret scan and redaction tests pass for success and error paths."

