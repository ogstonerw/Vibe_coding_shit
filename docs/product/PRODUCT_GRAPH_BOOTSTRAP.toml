git_head = "bd0027c316087a11193ca6662c27861adc87030f"
source_branch = "feature/factory-001a-control-plane"
evidence_refs = ["git:bd0027c316087a11193ca6662c27861adc87030f", "factory:FACTORY-001A", "owner-direction:FACTORY-001A-accepted"]
note = "Current Owner direction accepts FACTORY-001A; existing runtime registry text is not changed by this bootstrap."

[authority]
capital_authority = false
paper_authority = false
limited_live_authority = false
live_authority = false
current_factory_stage = "FACTORY-001A"
current_product_change_scope = "DOCUMENTATION_ONLY"
product_change_levels = ["PRODUCT_CHANGE_LEVEL_A", "PRODUCT_CHANGE_LEVEL_B", "PRODUCT_CHANGE_LEVEL_C"]
capital_mandate_level_namespace = "SEPARATE_FROM_PRODUCT_CHANGE_LEVELS"

[bootstrap_policy]
dependency_graph_must_be_acyclic = true
dependency_references_must_resolve = true
ids_must_be_globally_unique = true
done_objects_require_evidence = true
duplicate_runtime_registry_prohibited = true
ui_is_projection_only = true

[dependency_semantics]
default_dependency_type = "READINESS"
allowed_dependency_types = ["SCHEMA_INTERFACE", "READINESS", "ARTIFACT_EVIDENCE", "OPERATIONAL_SERVICE", "AUTHORITY"]
allowed_kinds = ["WAVE", "EPIC", "CAPABILITY", "TASK", "WORK_UNIT", "AUTHORITY_GATE", "CROSS_SCOPE"]
note = "The kind field identifies endpoint graph scope; CROSS_SCOPE is required when endpoint collections differ. dependency_type identifies blocking semantics."

