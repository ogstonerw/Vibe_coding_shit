[product]
id = "PRODUCT-AITOS"
name = "AI Trading Operating System"
owner_model = "ONE_OWNER"
status = "ACTIVE"
north_star = "AI Trading Operating System, в которой один Owner управляет виртуальной организацией ИИ-агентов, самостоятельно исследующей рынки, принимающей знания из разных источников, создающей и обучающей индивидуальных торговых агентов, разрабатывающей стратегии, доказывающей их качество, выпускающей контролируемые версии, эксплуатирующей их под жёсткими risk/authority gates и непрерывно предлагающей эволюцию продукта и стратегий."
cycle = ["OWNER_INTENT", "KNOWLEDGE", "RESEARCH", "HYPOTHESIS", "STRATEGY", "BOT", "PROVE", "RELEASE", "OPERATE", "OBSERVE", "LEARN", "EVOLVE"]

[baseline]
id = "BASELINE-FACTORY-001A-ACCEPTED"
